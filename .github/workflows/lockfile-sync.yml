name: Security lockfile sync

on:
  push:
    branches: [security/hardening-2026-11-rebased]

permissions:
  contents: write

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    if: github.actor == 'smpsandro1239'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve and patch compatible dependency versions
        continue-on-error: true
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Validate lockfile installation and production audit
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): commit audited security lockfile updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
