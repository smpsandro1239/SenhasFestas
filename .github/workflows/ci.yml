name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, testes, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senhasfestas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências (npm ci)
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Testes unitários
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Testes e2e (Postgres + Redis)
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: senhasfestas_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-nao-usado-em-producao
          FRONTEND_URL: http://localhost:3001
          RATE_LIMIT_MAX: 5
        run: npm run test:e2e

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_WS_URL: ws://localhost:3000

  browser-e2e:
    name: Browser E2E (realtime da planta)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senhasfestas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: senhasfestas_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-nao-usado-em-producao
      FRONTEND_URL: http://localhost:3001
      RATE_LIMIT_MAX: 1000
      BOOTSTRAP_ADMIN_EMAIL: admin@senhasfestas.com
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
      E2E_BASE_URL: http://localhost:3001
      E2E_API_URL: http://localhost:3000/api
      E2E_CHANNEL: chromium
      E2E_ADMIN_EMAIL: admin@senhasfestas.com
      E2E_ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências (backend + frontend)
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build do backend
        working-directory: backend
        run: npm run build

      - name: Migrações (cria o schema)
        working-directory: backend
        run: npm run migration:run

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      - name: Arrancar backend e frontend
        run: |
          (cd backend && npm run start:prod > /tmp/backend.log 2>&1 &)
          (cd frontend && npm run start > /tmp/frontend.log 2>&1 &)
          echo "à espera do backend (:3000) e frontend (:3001)…"
          npx --yes wait-on@8 http-get://localhost:3000/api/health http-get://localhost:3001/auth/login --timeout 120000

      - name: Testes browser (realtime da planta + cabeçalhos)
        working-directory: frontend
        run: npx playwright test e2e/planta-realtime.spec.ts e2e/security-headers.spec.ts

      - name: Logs em falha
        if: failure()
        run: |
          echo '===== backend ====='; tail -n 200 /tmp/backend.log || true
          echo '===== frontend ====='; tail -n 200 /tmp/frontend.log || true

  deploy:
    name: Deploy produção
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Correr migrações de base de dados
        if: env.DEPLOY_HOST != ''
        working-directory: backend
        env:
          NODE_ENV: production
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: "true"
        run: |
          npm ci
          npm run migration:run

      - name: Deploy via SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            git pull --ff-only
            bash scripts/deploy.sh